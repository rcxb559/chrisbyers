<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Chris Byers</title>
  <meta name="description" content="That page doesn't exist. Head back to chrisbyers.app.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c1a2e">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: var(--text-on-dark);
      padding: var(--gutter);
      text-align: center;
    }
    .nf-inner { max-width: 44ch; }
    .nf-code {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted-on-dark);
      margin: 0 0 20px;
    }
    .nf h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(44px, 9vw, 86px);
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 20px;
    }
    .nf p {
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.6;
      color: var(--muted-on-dark);
      margin: 0 0 32px;
    }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <p class="nf-code">Error 404</p>
      <h1>This page moved on.</h1>
      <p>
        The link you followed doesn&rsquo;t lead anywhere. The homepage has the
        current work, the history, and the press archive.
      </p>
      <div class="nf-actions">
        <a class="btn btn--primary" href="/">
          Go to the homepage
          <svg class="od-icon icon-14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>
        </a>
        <a class="btn btn--outline-light" href="mailto:chris@chrisbyers.app">Email Chris</a>
      </div>
    </div>
  </main>
</body>
</html>
